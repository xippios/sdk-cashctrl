# Nightly live smoke tests (conventions §10): every test marked `live` against the real
# upstream, on a schedule and on demand, never on a pull request.
# The write tests run too: they act only on data kept for testing and clean up after
# themselves.
# Rendered by the template (the one workflow that is): the secret it names is the source's
# key variable, and its start time derives from the slug. Edited by hand for the
# organisation model (ADR-0024): the live tests reach the reserved demo organisation only,
# declared by CASHCTRL_DEMO_SUBDOMAIN and CASHCTRL_DEMO_API_KEY, so those two org secrets
# replace the rendered CASHCTRL_API_KEY, which nothing reads; CASHCTRL_ORGS is never set.
# Also by hand: --tb=short, since pytest's long traceback prints each frame's arguments,
# an upstream payload among them, into this public log.
# From template v0.2.2 on this file is cashctrl's own and is never re-rendered (D35), so
# its pins are bumped by hand (conventions §13).
name: Live

on:
  schedule:
    # 02:36 UTC, staggered from the slug (live_schedule in sdk-template's copier.yml)
    # so that sources sharing a key do not start together.
    - cron: "36 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m live --tb=short
        # The demo organisation's pair, from the org secrets, for this step only: checkout,
        # setup-uv and uv sync never see it.
        env:
          XIPPIOS_LIVE_TESTS: "1"
          CASHCTRL_DEMO_SUBDOMAIN: ${{ secrets.CASHCTRL_DEMO_SUBDOMAIN }}
          CASHCTRL_DEMO_API_KEY: ${{ secrets.CASHCTRL_DEMO_API_KEY }}
